<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ameisenkolonie</title>
<style>
  :root { --bg: #0b0d10; --panel: rgba(20, 24, 30, .75); --text: #e8edf2; --accent: #7dffb0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center;
    gap: 12px; padding: 12px; pointer-events: none; flex-wrap: wrap; }
  .chip { background: var(--panel); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 8px 16px; text-align: center; }
  .chip b { display: block; font-size: 26px; color: var(--accent); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(125,255,176,.6); }
  .chip span { font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .08em; }
  #help { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .55;
    pointer-events: none; padding: 0 12px; }
  #reset { pointer-events: auto; cursor: pointer; background: var(--panel); color: var(--text);
    border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 8px 16px; font: inherit; }
  #reset:hover { border-color: var(--accent); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="chip"><b id="food">0</b><span>Futter gesammelt</span></div>
  <div class="chip"><b id="ants">0</b><span>Ameisen</span></div>
  <button id="reset">Neustart</button>
</div>
<div id="help">Klick: Futterquelle platzieren · Mausrad / Leertaste: Geschwindigkeit · Pheromone verblassen mit der Zeit</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const foodEl = document.getElementById('food');
  const antsEl = document.getElementById('ants');

  const CELL = 4;              // Pixel pro Pheromon-Zelle
  const ANT_COUNT = 250;
  const EVAPORATION = 0.992;   // pro Schritt: langsames Verblassen
  const DIFFUSION = 0.12;
  const DEPOSIT = 1.0;
  const SENSOR_DIST = 14, SENSOR_ANGLE = 0.6;
  const NEST_R = 22;

  let W, H, gw, gh, pher, tmp, img, glow, glowCtx;
  let nest, foods, ants, collected, speed = 1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gw = Math.ceil(W / CELL); gh = Math.ceil(H / CELL);
    glow = document.createElement('canvas'); glow.width = gw; glow.height = gh;
    glowCtx = glow.getContext('2d');
    img = glowCtx.createImageData(gw, gh);
    init();
  }

  function addFood(x, y) {
    foods.push({ x, y, amount: 200, max: 200, r: 16 });
  }

  function init() {
    pher = new Float32Array(gw * gh);
    tmp = new Float32Array(gw * gh);
    nest = { x: W / 2, y: H / 2 };
    collected = 0;
    foods = [];
    const n = 5;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.6;
      const d = Math.min(W, H) * (0.28 + Math.random() * 0.15);
      addFood(
        Math.max(40, Math.min(W - 40, nest.x + Math.cos(a) * d * (W / H > 1 ? 1.4 : 1))),
        Math.max(70, Math.min(H - 40, nest.y + Math.sin(a) * d))
      );
    }
    ants = Array.from({ length: ANT_COUNT }, () => ({
      x: nest.x, y: nest.y, a: Math.random() * Math.PI * 2, carry: false
    }));
  }

  const idx = (x, y) => {
    const gx = (x / CELL) | 0, gy = (y / CELL) | 0;
    return gx < 0 || gy < 0 || gx >= gw || gy >= gh ? -1 : gy * gw + gx;
  };
  const sense = (x, y) => { const i = idx(x, y); return i < 0 ? -1 : pher[i]; };
  const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

  function stepAnt(a) {
    if (a.carry) {
      // Zurück zum Nest, leichtes Rauschen, Pheromon hinterlassen
      const target = Math.atan2(nest.y - a.y, nest.x - a.x);
      a.a += angDiff(a.a, target) * 0.18 + (Math.random() - 0.5) * 0.3;
      const i = idx(a.x, a.y);
      if (i >= 0) pher[i] = Math.min(pher[i] + DEPOSIT, 12);
      if (Math.hypot(nest.x - a.x, nest.y - a.y) < NEST_R) {
        a.carry = false; collected++;
        a.a += Math.PI; // wieder rausgehen
      }
    } else {
      // Pheromon-Sensoren links / mitte / rechts
      const sx = d => a.x + Math.cos(a.a + d) * SENSOR_DIST;
      const sy = d => a.y + Math.sin(a.a + d) * SENSOR_DIST;
      const l = sense(sx(-SENSOR_ANGLE), sy(-SENSOR_ANGLE));
      const m = sense(sx(0), sy(0));
      const r = sense(sx(SENSOR_ANGLE), sy(SENSOR_ANGLE));
      if (Math.max(l, m, r) > 0.05) {
        if (m >= l && m >= r) a.a += (Math.random() - 0.5) * 0.15;
        else if (l > r) a.a -= 0.25;
        else a.a += 0.25;
      }
      a.a += (Math.random() - 0.5) * 0.5; // zufälliges Umherlaufen
      for (const f of foods) {
        if (f.amount > 0 && Math.hypot(f.x - a.x, f.y - a.y) < f.r + 3) {
          f.amount--; a.carry = true; a.a += Math.PI; break;
        }
      }
    }
    const sp = 1.6;
    a.x += Math.cos(a.a) * sp; a.y += Math.sin(a.a) * sp;
    if (a.x < 2 || a.x > W - 2) { a.a = Math.PI - a.a; a.x = Math.max(2, Math.min(W - 2, a.x)); }
    if (a.y < 2 || a.y > H - 2) { a.a = -a.a; a.y = Math.max(2, Math.min(H - 2, a.y)); }
  }

  function updatePheromones() {
    // Diffusion + Verdunstung
    for (let y = 0; y < gh; y++) {
      for (let x = 0; x < gw; x++) {
        const i = y * gw + x;
        const v = pher[i];
        const xl = x > 0 ? pher[i - 1] : v, xr = x < gw - 1 ? pher[i + 1] : v;
        const yu = y > 0 ? pher[i - gw] : v, yd = y < gh - 1 ? pher[i + gw] : v;
        const avg = (xl + xr + yu + yd) * 0.25;
        let n = (v + (avg - v) * DIFFUSION) * EVAPORATION - 0.0008;
        tmp[i] = n > 0 ? n : 0;
      }
    }
    [pher, tmp] = [tmp, pher];
  }

  function renderPheromones() {
    const d = img.data;
    for (let i = 0; i < pher.length; i++) {
      const v = Math.min(pher[i] / 4, 1);
      const o = i * 4;
      const g = Math.pow(v, 0.6);
      d[o] = 60 + 195 * v * v;        // heißer Kern
      d[o + 1] = 255 * g;
      d[o + 2] = 140 * g + 80 * v * v;
      d[o + 3] = 255 * g;
    }
    glowCtx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(3px)';
    ctx.drawImage(glow, 0, 0, gw * CELL, gh * CELL);
    ctx.filter = 'none';
    ctx.globalAlpha = 0.6;
    ctx.drawImage(glow, 0, 0, gw * CELL, gh * CELL);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function draw() {
    ctx.fillStyle = '#0b0d10';
    ctx.fillRect(0, 0, W, H);

    renderPheromones();

    // Futterquellen
    for (const f of foods) {
      if (f.amount <= 0) continue;
      const r = f.r * (0.45 + 0.55 * f.amount / f.max);
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r * 2.2);
      g.addColorStop(0, 'rgba(255,214,90,.5)'); g.addColorStop(1, 'rgba(255,214,90,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, r * 2.2, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd25a'; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill();
    }

    // Nest
    const ng = ctx.createRadialGradient(nest.x, nest.y, 0, nest.x, nest.y, NEST_R * 2.5);
    ng.addColorStop(0, 'rgba(160,110,70,.55)'); ng.addColorStop(1, 'rgba(160,110,70,0)');
    ctx.fillStyle = ng; ctx.beginPath(); ctx.arc(nest.x, nest.y, NEST_R * 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#5a3d27'; ctx.beginPath(); ctx.arc(nest.x, nest.y, NEST_R, 0, 7); ctx.fill();
    ctx.fillStyle = '#2a1a0f'; ctx.beginPath(); ctx.arc(nest.x, nest.y, NEST_R * 0.5, 0, 7); ctx.fill();

    // Ameisen
    for (const a of ants) {
      ctx.fillStyle = a.carry ? '#ffe9a0' : '#e8edf2';
      ctx.beginPath(); ctx.arc(a.x, a.y, 1.8, 0, 7); ctx.fill();
      ctx.fillStyle = a.carry ? '#ffd25a' : '#aeb7c0';
      ctx.beginPath();
      ctx.arc(a.x - Math.cos(a.a) * 2.4, a.y - Math.sin(a.a) * 2.4, 1.4, 0, 7); ctx.fill();
      if (a.carry) {
        ctx.fillStyle = '#ffd25a';
        ctx.beginPath();
        ctx.arc(a.x + Math.cos(a.a) * 3, a.y + Math.sin(a.a) * 3, 1.6, 0, 7); ctx.fill();
      }
    }
    foodEl.textContent = collected;
    antsEl.textContent = ants.length;
  }

  function frame() {
    for (let s = 0; s < speed; s++) {
      for (const a of ants) stepAnt(a);
      updatePheromones();
    }
    draw();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('click', e => addFood(e.clientX, e.clientY));
  addEventListener('wheel', e => { speed = Math.max(1, Math.min(6, speed + (e.deltaY < 0 ? 1 : -1))); });
  addEventListener('keydown', e => { if (e.code === 'Space') { speed = speed >= 3 ? 1 : speed + 1; e.preventDefault(); } });
  document.getElementById('reset').addEventListener('click', init);
  addEventListener('resize', resize);

  resize();
  frame();
})();
</script>
</body>
</html>
